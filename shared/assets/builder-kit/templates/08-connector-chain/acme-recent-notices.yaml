ref: acme-recent-notices
kind: workflow
label: Recent Acme Notices
description: Lists the items a feed published in the last 24 hours, through the Date Helper and RSS connectors.
params:
  feedUrl: { type: string, description: 'The RSS or Atom feed URL' }
blocks:
  - id: get-now
    type: activepiece
    with:
      piece: '@activepieces/piece-date-helper'
      version: '0.2.0'
      action: get_current_date
      input:
        timeFormat: 'X'
        timeZone: UTC
    out: now

  - id: get-cutoff
    type: activepiece
    with:
      piece: '@activepieces/piece-date-helper'
      version: '0.2.0'
      action: add_subtract_date
      input:
        inputDate: '${ctx.now.result}'
        inputDateFormat: 'X'
        expression: '- 24 hour'
        outputFormat: 'YYYY-MM-DDTHH:mm:ss'
        timeZone: UTC
    out: cutoff

  - id: read-feed
    type: activepiece
    with:
      piece: '@activepieces/piece-rss'
      version: '0.7.0'
      action: rss_read_feed
      input:
        rss_feed_url: '${params.feedUrl}'
        published_after: '${ctx.cutoff.result}Z'
        limit: 10
    out: feed
return:
  publishedAfter: '${ctx.cutoff.result}Z'
  items: '${ctx.feed.items.map(item => ({ title: item.title, link: item.link }))}'
