ref: acme-message-classifier
kind: project
label: Acme Message Classifier
version: '1.0.0'
description: Classifies a job-related message with a configured model.
config:
  env:
    - title: AI Model
      fields:
        classifierModel:
          type: LLM_MODEL
          required: true
          displayName: Message Classifier Model
          description: Provider, model and API-key credential that classify-message runs with
          defaultValue:
            provider: anthropic
            model: claude-haiku-4-5
            max-tokens: 256
            api-key: acme-anthropic-key
