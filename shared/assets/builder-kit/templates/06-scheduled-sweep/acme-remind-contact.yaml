ref: acme-remind-contact
kind: workflow
label: Remind Site Contact
description: >
  Tells one job's site contact about tomorrow's visit, then meters the
  reminder once it is sent. Keyed by job and visit date, so starting it again
  for the same visit joins the existing run instead of reminding twice.
idempotency:
  key: 'visit-reminder-${params.jobId}-${params.visitDate}'
params:
  jobId: string
  jobReference: string
  contactId: string
  visitDate: string
  stripeCustomerId: string
blocks:
  - id: get-contact
    type: http
    with:
      url: '${config.acmeBaseUrl}/contacts/${params.contactId}'
      headers:
        Authorization: 'Bearer {{ secret("acme-api-token") }}'
    out: contact

  - id: send-reminder
    type: scm
    wait: true
    with:
      stakeholder:
        emails: [{ value: '${ctx.contact.body.email}', is-primary: true }]
        forename: '${ctx.contact.body.firstName}'
        surname: '${ctx.contact.body.lastName}'
      goal: Remind the site contact that an engineer visits tomorrow for job ${params.jobReference}.
      impersonate:
        id: acme-scheduling-desk
        from-name: '${config.senderName}'
      slots: []
      briefs:
        - name: visit
          value: Our engineer will visit on ${params.visitDate} for job ${params.jobReference}.
          description: The visit being confirmed
      timeout: 1d
    out: reminder

  - id: meter-reminder
    type: billing
    if: "${ctx.reminder.outcome === 'fulfilled'}"
    with:
      action: record-usage
      event: visit-reminder.sent
      stripe-customer-id: '${params.stripeCustomerId}'
      event-id: 'visit-reminder-${params.jobId}-${params.visitDate}'
      metadata: { jobId: '${params.jobId}' }
return:
  jobId: '${params.jobId}'
  sent: "${ctx.reminder.outcome === 'fulfilled'}"
