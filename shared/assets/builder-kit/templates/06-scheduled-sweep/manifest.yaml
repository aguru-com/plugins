ref: acme-scheduled-sweep
kind: project
label: Acme Visit Reminders
description: Reminds site contacts the day before a visit.
config:
  install:
    - title: Settings
      fields:
        acmeBaseUrl:
          type: SHORT_TEXT
          required: true
          displayName: Acme API Base URL
          description: Base URL of the Acme Jobs API, without a trailing slash
          defaultValue: https://api.acme-jobs.example/v1
  setup:
    activates: acme-visit-reminders
    schedule: { every: 24h }
    steps:
      - title: Email
        description: The sender name on reminders.
        wizard: true
        fields:
          senderName:
            type: SHORT_TEXT
            required: true
            displayName: Sender Name
            description: The name your contacts see on our emails.
            defaultValue: Acme Scheduling
