ref: acme-chase-completion-report
kind: workflow
label: Chase Completion Report
description: >
  Asks the contractor for a job's signed completion report, reminds them on a
  fixed schedule, escalates to the operations contact when reminders run out,
  and hands the job to an operator if the report never arrives. A received
  report closes the job in the Acme Jobs API.
params:
  jobId: { type: string, description: The Acme job id }
  jobReference: { type: string, description: 'The Acme job reference, e.g. JOB-0042' }
  contractor:
    type: object
    description: The contractor who did the work
    props:
      email: string
      name: string
blocks:
  - id: ask-for-report
    type: scm
    wait: true
    with:
      stakeholder:
        emails: [{ value: '${params.contractor.email}', is-primary: true }]
        name: '${params.contractor.name}'
      goal: Collect the signed completion report for job ${params.jobReference}.
      impersonate:
        id: acme-operations
        from-name: '${config.senderName}'
      slots:
        - name: completionReport
          kind: attachment
          description: Please reply with the signed completion report for job ${params.jobReference} attached.
          mime-types: [application/pdf, image/*]
          self-checks:
            - Is the attachment a completion report for job ${params.jobReference}, not a quote or an invoice?
      timeout: 21d
      follow-up:
        sequence: [2d, 3d, 3d]
        weekdays: [mon, tue, wed, thu, fri]
        on-exhaustion: escalate
      escalation:
        mode: notify
        steps:
          - after: 0d
            email:
              to: '${config.escalationEmail}'
              subject: 'No completion report for ${params.jobReference}'
              body: >
                <p>${params.contractor.name} has not sent the completion report
                for job ${params.jobReference} after three reminders. Please
                chase them directly.</p>
    out: report

  - id: route-report
    type: router
    branches:
      - when: "${ctx.report.outcome === 'fulfilled'}"
        do:
          - id: close-job
            type: http
            with:
              method: PATCH
              url: '${config.acmeBaseUrl}/jobs/${params.jobId}'
              headers:
                Authorization: 'Bearer {{ secret("acme-api-token") }}'
              body:
                status: completed
                completionReportId: '${ctx.report.slots.completionReport.value.id}'
      - else:
          - id: ask-operator
            type: hitl
            with:
              signal: completion-report-decision
              reason: >-
                No completion report for ${params.jobReference} from
                ${params.contractor.name} after reminders and escalation
                (${ctx.report.outcome}). Close the job anyway, or leave it open?
              fields:
                - name: decision
                  type: select
                  label: Decision
                  required: true
                  options:
                    - { value: close, label: Close the job }
                    - { value: keep-open, label: Leave it open }
              timeout: 14d
            out: operator

          - id: close-job-without-report
            type: http
            if: "${ctx.operator?.decision === 'close'}"
            with:
              method: PATCH
              url: '${config.acmeBaseUrl}/jobs/${params.jobId}'
              headers:
                Authorization: 'Bearer {{ secret("acme-api-token") }}'
              body:
                status: completed
return:
  outcome: '${ctx.report.outcome}'
  closedBy: "${ctx.report.outcome === 'fulfilled' ? 'report' : ctx.operator?.decision === 'close' ? 'operator' : null}"
