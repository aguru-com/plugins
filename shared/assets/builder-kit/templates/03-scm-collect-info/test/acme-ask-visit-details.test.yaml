ref: acme-ask-visit-details

e2e:
  - it: registers the need with what to ask and when to give up
    params: &params
      jobReference: JOB-0042
      siteName: Harbour Road Depot
      contact: { email: dana.reyes@example.test, firstName: Dana, lastName: Reyes }
    config: &config
      visitSubjectTemplate: 'Visit for ${jobReference} at ${siteName}'
      senderName: Acme Scheduling
    mocks:
      - block: ask-visit-details
        out:
          outcome: fulfilled
          slots:
            visitDate: { status: filled, value: '2026-10-22' }
            timeWindow: { status: filled, value: morning }
            accessNotes: { status: missing }
    events:
      - on: ask-visit-details
        expect-in:
          stakeholder:
            emails: [{ value: dana.reyes@example.test, is-primary: true }]
          email:
            subject:
              template: 'Visit for ${jobReference} at ${siteName}'
              vars: { jobReference: JOB-0042, siteName: Harbour Road Depot }
          outcomes: [[visitDate, timeWindow]]
          timeout: 7d
    post-run:
      - return:
          outcome: fulfilled
          visitDate: '2026-10-22'
          timeWindow: morning
          accessNotes: null

  - it: passes on optional access notes when the contact gave them
    params: *params
    config: *config
    mocks:
      - block: ask-visit-details
        out:
          outcome: fulfilled
          slots:
            visitDate: { status: filled, value: '2026-10-22' }
            timeWindow: { status: filled, value: afternoon }
            accessNotes: { status: filled, value: Gate code 4471 }
    post-run:
      - return: { timeWindow: afternoon, accessNotes: Gate code 4471 }

  - it: returns nulls when the contact never answered
    params: *params
    config:
      {
        visitSubjectTemplate: 'Visit for ${jobReference} at ${siteName}',
        senderName: Acme Scheduling,
        contactTimeout: 3d,
      }
    mocks:
      - block: ask-visit-details
        out:
          outcome: abandoned
          slots:
            visitDate: { status: missing }
            timeWindow: { status: missing }
            accessNotes: { status: missing }
    events:
      - on: ask-visit-details
        expect-in: { timeout: 3d }
    post-run:
      - return: { outcome: abandoned, visitDate: null, timeWindow: null, accessNotes: null }
