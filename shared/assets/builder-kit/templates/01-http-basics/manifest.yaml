ref: acme-http-basics
kind: project
label: Acme HTTP Basics
description: Reads a job from the Acme Jobs API.
config:
  install:
    - title: Settings
      fields:
        acmeBaseUrl:
          type: SHORT_TEXT
          required: true
          displayName: Acme API Base URL
          description: Base URL of the Acme Jobs API, without a trailing slash
          defaultValue: https://api.acme-jobs.example/v1
