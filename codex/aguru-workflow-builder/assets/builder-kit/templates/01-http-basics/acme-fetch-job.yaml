ref: acme-fetch-job
kind: subflow
label: Fetch Acme Job
description: Reads one job from the Acme Jobs API and returns the fields callers use.
params:
  jobId: { type: string, description: The Acme job id, as a string }
blocks:
  - id: get-job
    type: http
    with:
      method: GET
      url: '${config.acmeBaseUrl}/jobs/${params.jobId}'
      headers:
        Authorization: 'Bearer {{ secret("acme-api-token") }}'
        Accept: application/json
    out: job
return:
  id: '${String(ctx.job.body.id)}'
  reference: '${ctx.job.body.reference}'
  status: '${ctx.job.body.status}'
  siteId: '${String(ctx.job.body.siteId)}'
  contactId: '${String(ctx.job.body.contactId)}'
  visitDate: '${ctx.job.body.visitDate}'
