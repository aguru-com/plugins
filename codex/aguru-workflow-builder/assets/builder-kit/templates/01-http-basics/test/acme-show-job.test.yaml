ref: acme-show-job

e2e:
  - it: logs and returns the fetched job
    params: { jobId: '42' }
    config: { acmeBaseUrl: https://api.acme-jobs.example/v1 }
    mocks:
      - block: fetch-job.get-job
        out: 'fixture:./job-42.json'
    events:
      - on: log-status
        expect-in: { level: info, message: Job JOB-0042 is open }
    post-run:
      - return: { id: '42', reference: JOB-0042 }
