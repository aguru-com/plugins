ref: acme-complete-job-record
kind: workflow
label: Complete Job Record
description: >
  Makes sure a job record has access notes and a parking answer before a
  visit. Reads the job, asks the site contact for what is missing, writes the
  answer back, and hands the job to an operator when someone else changed the
  record in the meantime.
params:
  jobId: { type: string, description: The Acme job id }
blocks:
  - id: record
    type: state-machine
    with:
      input:
        jobId: '${params.jobId}'
      start: fetch
      max-transitions: 8
      state:
        schema:
          type: object
          props:
            jobReference: string
            contact:
              type: object
              props: { email: string, firstName: string, lastName: string }
            answers:
              type: object
              required: false
              props: { accessNotes: string, onSiteParking: boolean }
            force: boolean
        initial:
          jobReference: ''
          contact: { email: '', firstName: '', lastName: '' }
          force: false
      nodes:
        fetch:
          ref: acme-record-fetch
          on:
            complete: done
            incomplete: ask

        ask:
          blocks:
            - id: ask-contact
              type: scm
              wait: true
              with:
                stakeholder:
                  emails: [{ value: '${params.state.contact.email}', is-primary: true }]
                  forename: '${params.state.contact.firstName}'
                  surname: '${params.state.contact.lastName}'
                goal: >
                  Complete the site record for job ${params.state.jobReference}
                  before an engineer visits: how to get in, and whether there
                  is parking on site.
                impersonate:
                  id: acme-records-team
                  from-name: '${config.senderName}'
                slots:
                  - name: accessNotes
                    kind: string
                    description: How should our engineer get into the site for job ${params.state.jobReference}? For example a gate code, a key safe or who to ask at reception.
                    self-checks:
                      - Does the answer say how to get into the site, rather than only when someone is available?
                  - name: onSiteParking
                    kind: boolean
                    description: Is there parking on site for our engineer's van?
                    self-checks:
                      - Did the contact say clearly whether there is parking on site, true for yes and false for no?
                    quick-actions:
                      heading: Is there parking on site for the job ${params.state.jobReference} visit?
                      choices:
                        - { value: true, label: Yes, there is parking }
                        - { value: false, label: No parking on site }
                outcomes: [[accessNotes, onSiteParking]]
                timeout: '${config.contactTimeout || "10d"}'
                follow-up:
                  maximum-attempts: 3
                  initial-interval: 2d
                  backoff-coefficient: 1.5
                  on-exhaustion: abandon
              out: reply
          return:
            completion: "${ctx.reply.outcome === 'fulfilled' ? 'answered' : 'no-answer'}"
            stateUpdate:
              answers:
                accessNotes: '${ctx.reply.slots.accessNotes?.value ?? ""}'
                onSiteParking: '${ctx.reply.slots.onSiteParking?.value === true}'
          on:
            answered: write
            no-answer: gave-up

        write:
          blocks:
            - id: normalize-answers
              type: js
              with:
                code: |
                  const notes = params.state.answers.accessNotes.replace(/\s+/g, ' ').trim();
                  return {
                    accessNotes: notes.length > 500 ? notes.slice(0, 497) + '...' : notes,
                    onSiteParking: params.state.answers.onSiteParking,
                  };
              out: answers

            - id: reread-job
              type: http
              if: '${!params.state.force}'
              with:
                url: '${config.acmeBaseUrl}/jobs/${params.input.jobId}'
                headers:
                  Authorization: 'Bearer {{ secret("acme-api-token") }}'
              out: current

            - id: check-conflict
              type: js
              if: '${!params.state.force}'
              with:
                code: |
                  const notes = (ctx.current.body.accessNotes || '').trim();
                  const parking = ctx.current.body.onSiteParking;
                  const isNotesChanged = notes !== '' && notes !== ctx.answers.accessNotes;
                  const isParkingChanged = parking != null && parking !== ctx.answers.onSiteParking;
                  return isNotesChanged || isParkingChanged;
              out: isConflict

            - id: write-answers
              type: http
              if: '${!ctx.isConflict}'
              with:
                method: PATCH
                url: '${config.acmeBaseUrl}/jobs/${params.input.jobId}'
                headers:
                  Authorization: 'Bearer {{ secret("acme-api-token") }}'
                body: '${ctx.answers}'
          return:
            completion: "${ctx.isConflict ? 'conflict' : 'written'}"
          on:
            written: done
            conflict: resolve

        resolve:
          blocks:
            - id: ask-operator
              type: hitl
              with:
                signal: record-conflict-decision
                reason: >-
                  Someone changed the access notes or the parking answer on
                  ${params.state.jobReference} while we were asking the site
                  contact. Overwrite them with the contact's answers, or keep
                  what is on the record?
                fields:
                  - name: decision
                    type: select
                    label: Decision
                    required: true
                    options:
                      - { value: use-answer, label: "Use the contact's answer" }
                      - { value: keep-record, label: Keep the record }
              out: operator
          return:
            completion: "${ctx.operator.decision === 'use-answer' ? 'use-answer' : 'keep-record'}"
            stateUpdate:
              force: "${ctx.operator.decision === 'use-answer'}"
          on:
            use-answer: write
            keep-record: done

        done:
          blocks: []
          return:
            result: { jobReference: '${params.state.jobReference}' }
          terminal: { outcome: completed }

        gave-up:
          blocks: []
          return:
            result: { jobReference: '${params.state.jobReference}' }
            reason: The site contact did not answer before the deadline.
          terminal: { outcome: no-answer }
    out: outcome
return: '${ctx.outcome}'
