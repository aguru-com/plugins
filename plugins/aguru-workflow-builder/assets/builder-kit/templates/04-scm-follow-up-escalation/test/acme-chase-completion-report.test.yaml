ref: acme-chase-completion-report

e2e:
  - it: registers reminders and an escalation to the operations contact
    params: &params
      jobId: '42'
      jobReference: JOB-0042
      contractor: { email: sam.okafor@example.test, name: Sam Okafor }
    config: &config
      acmeBaseUrl: https://api.acme-jobs.example/v1
      senderName: Acme Operations
      escalationEmail: ops@example.test
    mocks:
      - block: ask-for-report
        out: 'fixture:./report.json'
      - block: route-report.0.close-job
        out: { success: true, statusCode: 200, body: { status: completed } }
    events:
      - on: ask-for-report
        expect-in:
          follow-up: { sequence: [2d, 3d, 3d], on-exhaustion: escalate }
          escalation:
            steps:
              - after: 0d
                email: { to: ops@example.test, subject: No completion report for JOB-0042 }
    post-run:
      - return: { outcome: fulfilled }

  - it: closes the job with the received report
    params: *params
    config: *config
    mocks:
      - block: ask-for-report
        out: 'fixture:./report.json'
      - block: route-report.0.close-job
        out: { success: true, statusCode: 200, body: { status: completed } }
    events:
      - on: route-report.0.close-job
        expect-in:
          method: PATCH
          url: https://api.acme-jobs.example/v1/jobs/42
          body: { status: completed, completionReportId: att-9f1c }
    post-run:
      - block: route-report.1.ask-operator
        called: false
      - return: { outcome: fulfilled, closedBy: report }

  - it: closes the job when the operator decides to, after no report
    params: *params
    config: *config
    mocks:
      - block: ask-for-report
        out: { outcome: abandoned, slots: { completionReport: { status: missing } } }
      - block: route-report.1.close-job-without-report
        out: { success: true, statusCode: 200, body: { status: completed } }
    events:
      - on: route-report.1.ask-operator
        signal: { name: completion-report-decision, payload: { decision: close } }
    post-run:
      - return: { outcome: abandoned, closedBy: operator }

  - it: leaves the job open when the operator never decides
    params: *params
    config: *config
    mocks:
      - block: ask-for-report
        out: { outcome: abandoned, slots: { completionReport: { status: missing } } }
    events:
      - on: route-report.1.ask-operator
        skip-time: 15d
    post-run:
      - block: route-report.1.close-job-without-report
        called: false
      - return: { outcome: abandoned, closedBy: null }
