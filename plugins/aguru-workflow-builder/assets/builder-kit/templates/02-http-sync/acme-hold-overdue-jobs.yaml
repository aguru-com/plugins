ref: acme-hold-overdue-jobs
kind: workflow
label: Hold Overdue Acme Jobs
description: >
  Lists every scheduled job, finds the ones whose visit date has passed, and
  puts each on hold. A job the API refuses to update is logged and counted,
  not fatal, so one bad record never stops the sweep.
params:
  asOf:
    type: string
    required: false
    description: ISO date (YYYY-MM-DD) to compare visit dates against. Defaults to today.
blocks:
  - id: list-scheduled-jobs
    type: http
    with:
      method: GET
      url: '${config.acmeBaseUrl}/jobs'
      headers:
        Authorization: 'Bearer {{ secret("acme-api-token") }}'
      query:
        status: scheduled
        limit: 100
      pagination:
        style: token
        items: items
        cursor: meta.nextCursor
        cursor-param: cursor
        max-pages: 20
    out: scheduledJobs

  - id: find-overdue
    type: js
    with:
      code: |
        const asOf = params.asOf || new Date().toISOString().slice(0, 10);
        return ctx.scheduledJobs.body.items
          .filter((job) => job.visitDate && job.visitDate < asOf)
          .map((job) => ({ id: String(job.id), reference: job.reference }));
    out: overdue

  - id: hold-each
    type: loop
    over: '${ctx.overdue}'
    as: job
    do:
      - id: hold-job
        type: http
        with:
          method: PATCH
          url: '${config.acmeBaseUrl}/jobs/${ctx.job.id}'
          headers:
            Authorization: 'Bearer {{ secret("acme-api-token") }}'
          body:
            status: on-hold
          fail-on-error: false
        out: held

      - id: log-hold-failed
        type: log
        if: '${!ctx.held.success}'
        with:
          level: warn
          message: 'Could not hold ${ctx.job.reference}: HTTP ${ctx.held.statusCode}'
    collect: held
    out: holds

  - id: log-incomplete-listing
    type: log
    if: '${!ctx.scheduledJobs.pagination.completed}'
    with:
      level: warn
      message: 'Stopped listing after ${ctx.scheduledJobs.pagination.pagesFetched} pages; more jobs may remain'
return:
  scanned: '${ctx.scheduledJobs.body.items.length}'
  held: '${ctx.holds.filter(result => result.success).length}'
  failed: '${ctx.holds.filter(result => !result.success).length}'
