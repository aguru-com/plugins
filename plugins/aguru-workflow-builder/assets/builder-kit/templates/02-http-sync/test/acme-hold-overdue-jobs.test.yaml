ref: acme-hold-overdue-jobs

unit:
  - describe: find-overdue
    tests:
      - it: keeps jobs whose visit date is before asOf, ids as strings
        block: find-overdue
        params: { asOf: '2026-10-15' }
        ctx:
          scheduledJobs:
            body:
              items:
                - { id: 42, reference: JOB-0042, visitDate: '2026-10-01' }
                - { id: 43, reference: JOB-0043, visitDate: '2026-10-20' }
        events:
          - on: find-overdue
            expect-out: [{ id: '42', reference: JOB-0042 }]

      - it: skips jobs with no visit date
        block: find-overdue
        params: { asOf: '2026-10-15' }
        ctx:
          scheduledJobs:
            body:
              items: [{ id: 45, reference: JOB-0045, visitDate: null }]
        events:
          - on: find-overdue
            expect-out: []

      - it: treats a visit on asOf as not yet overdue
        block: find-overdue
        params: { asOf: '2026-10-15' }
        ctx:
          scheduledJobs:
            body:
              items: [{ id: 46, reference: JOB-0046, visitDate: '2026-10-15' }]
        events:
          - on: find-overdue
            expect-out: []

  - it: lists scheduled jobs page by page
    block: list-scheduled-jobs
    params: {}
    config: { acmeBaseUrl: https://api.acme-jobs.example/v1 }
    events:
      - on: list-scheduled-jobs
        expect-in:
          url: https://api.acme-jobs.example/v1/jobs
          query: { status: scheduled }
          pagination: { cursor: meta.nextCursor, cursor-param: cursor }

e2e:
  - it: holds every overdue job
    params: { asOf: '2026-10-15' }
    config: { acmeBaseUrl: https://api.acme-jobs.example/v1 }
    mocks:
      - block: list-scheduled-jobs
        out: 'fixture:./scheduled-jobs.json'
      - block: hold-each.*.hold-job
        out: { success: true, statusCode: 200, body: { status: on-hold } }
        times: 2
    events:
      - on: hold-each.0.hold-job
        expect-in:
          method: PATCH
          url: https://api.acme-jobs.example/v1/jobs/42
          body: { status: on-hold }
    post-run:
      - block: hold-each.*.log-hold-failed
        called: false
      - return: { scanned: 4, held: 2, failed: 0 }

  - it: logs and counts a job the API refuses, and carries on
    params: { asOf: '2026-10-15' }
    config: { acmeBaseUrl: https://api.acme-jobs.example/v1 }
    mocks:
      - block: list-scheduled-jobs
        out: 'fixture:./scheduled-jobs.json'
      - block: hold-each.*.hold-job
        out-seq:
          - { success: false, statusCode: 409, body: { error: job is locked } }
          - { success: true, statusCode: 200, body: { status: on-hold } }
    events:
      - on: hold-each.0.log-hold-failed
        expect-in: { level: warn, message: 'Could not hold JOB-0042: HTTP 409' }
    post-run:
      - return: { scanned: 4, held: 1, failed: 1 }

  - it: warns when the listing stopped at the page cap
    params: { asOf: '2026-10-15' }
    config: { acmeBaseUrl: https://api.acme-jobs.example/v1 }
    mocks:
      - block: list-scheduled-jobs
        out:
          success: true
          body: { items: [], meta: { nextCursor: c-21 } }
          pagination:
            { pagesFetched: 20, totalItems: 2000, completed: false, stopReason: max-pages }
    post-run:
      - block: log-incomplete-listing
        called: true
      - return: { scanned: 0, held: 0, failed: 0 }
