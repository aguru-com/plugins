ref: acme-remind-contact

e2e:
  - it: briefs the contact and meters the reminder once it is sent
    params:
      &params {
        jobId: '42',
        jobReference: JOB-0042,
        contactId: '311',
        visitDate: '2026-10-16',
        stripeCustomerId: cus_123,
      }
    config: &config { acmeBaseUrl: https://api.acme-jobs.example/v1, senderName: Acme Scheduling }
    mocks:
      - block: get-contact
        out:
          &contact {
            success: true,
            body: { email: dana.reyes@example.test, firstName: Dana, lastName: Reyes },
          }
      - block: send-reminder
        out: { needId: need-1, outcome: fulfilled, slots: {} }
      - block: meter-reminder
        out: { success: true, alreadyRecorded: false }
    events:
      - on: send-reminder
        expect-in:
          stakeholder: { emails: [{ value: dana.reyes@example.test, is-primary: true }] }
          briefs:
            - name: visit
              value: Our engineer will visit on 2026-10-16 for job JOB-0042.
      - on: meter-reminder
        expect-in: { event-id: visit-reminder-42-2026-10-16, stripe-customer-id: cus_123 }
    post-run:
      - return: { jobId: '42', sent: true }

  - it: does not meter a reminder that expired unsent
    params: *params
    config: *config
    mocks:
      - block: get-contact
        out: *contact
      - block: send-reminder
        out: { needId: need-1, outcome: abandoned, slots: {} }
    post-run:
      - block: meter-reminder
        called: false
      - return: { jobId: '42', sent: false }
