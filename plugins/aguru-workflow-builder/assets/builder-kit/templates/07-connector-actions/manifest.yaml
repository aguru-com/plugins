ref: acme-connector-actions
kind: project
label: Acme Connector Actions
description: Posts Acme job updates to Slack through the installed Slack connector.
config:
  install:
    - title: Settings
      fields:
        acmeBaseUrl:
          type: SHORT_TEXT
          required: true
          displayName: Acme API Base URL
          description: Base URL of the Acme Jobs API, without a trailing slash
          defaultValue: https://api.acme-jobs.example/v1
        slackCredential:
          type: SHORT_TEXT
          required: true
          displayName: Slack Credential
          description: Key of the saved API & HTTP credential holding the Slack bot token
          defaultValue: acme-slack
        slackChannelId:
          type: SHORT_TEXT
          required: true
          displayName: Slack Channel ID
          description: The channel updates are posted to, such as C0123456789
