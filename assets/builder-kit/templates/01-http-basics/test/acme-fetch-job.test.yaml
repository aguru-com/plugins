ref: acme-fetch-job

unit:
  - it: requests the job by id with the API token
    block: get-job
    params: { jobId: '42' }
    config: { acmeBaseUrl: https://api.acme-jobs.example/v1 }
    events:
      - on: get-job
        expect-in:
          method: GET
          url: https://api.acme-jobs.example/v1/jobs/42
          headers:
            Authorization:
              __secretRef: true
              parts: ['Bearer ', { secret: acme-api-token }]

e2e:
  - it: returns the job with its numeric ids as strings
    params: { jobId: '42' }
    config: { acmeBaseUrl: https://api.acme-jobs.example/v1 }
    mocks:
      - block: get-job
        out: 'fixture:./job-42.json'
    post-run:
      - return:
          id: '42'
          reference: JOB-0042
          status: open
          siteId: '7'
          contactId: '311'
