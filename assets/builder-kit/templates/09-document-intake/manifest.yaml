ref: acme-document-intake
kind: project
label: Acme Certificate Intake
description: Collects a job's safety certificate by email, reads it with a model and records it on the job.
config:
  env:
    - title: AI Model
      fields:
        certificateReaderModel:
          type: LLM_MODEL
          required: true
          displayName: Certificate Reader Model
          description: Provider, model and API-key credential that read-certificate runs with; the model must accept PDFs
          defaultValue:
            provider: anthropic
            model: claude-haiku-4-5
            max-tokens: 1024
            api-key: acme-anthropic-key
  install:
    - title: Settings
      fields:
        acmeBaseUrl:
          type: SHORT_TEXT
          required: true
          displayName: Acme API Base URL
          description: Base URL of the Acme Jobs API, without a trailing slash
          defaultValue: https://api.acme-jobs.example/v1
        senderName:
          type: SHORT_TEXT
          required: true
          displayName: Sender Name
          description: The name the contact sees the email from
          defaultValue: Acme Compliance
        contactTimeout:
          type: SHORT_TEXT
          required: false
          displayName: Give Up After
          description: How long to wait for the certificate before giving up, e.g. 7d
          defaultValue: 7d
